[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
addopts = 
    --strict-markers
    --disable-warnings
    --tb=short
    --strict
    --reuse-db
    --nomigrations
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    billing: marks tests related to billing functionality
    accounting: marks tests related to accounting functionality
    crm: marks tests related to CRM functionality
testpaths = 
    tests
    core
    users
    companies
    crm
    catalog
    billing
    accounting
    reports
    settingsapp
