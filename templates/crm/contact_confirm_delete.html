{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>Supprimer le contact</h3>
  <p>Confirmez la suppression de "{{ object.first_name }} {{ object.last_name }}".</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Confirmer</button>
    <a href="{% url 'crm:contact_list' %}" class="btn btn-secondary">Annuler</a>
  </form>
</div>
{% endblock %}
