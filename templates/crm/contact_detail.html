{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>{{ contact.first_name }} {{ contact.last_name }}</h3>
  <p><strong>Email:</strong> {{ contact.email }}</p>
  <p><strong>Téléphone:</strong> {{ contact.phone }}</p>
  <p><strong>Partie:</strong> {{ contact.party.name }}</p>
  <a href="{% url 'crm:contact_edit' contact.pk %}" class="btn btn-primary">Modifier</a>
  <a href="{% url 'crm:contact_delete' contact.pk %}" class="btn btn-outline-danger">Supprimer</a>
  <a href="{% url 'crm:contact_list' %}" class="btn btn-secondary">Retour</a>
</div>
{% endblock %}
