{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Contacts</h3>
    <a href="{% url 'crm:contact_create' %}" class="btn btn-primary">Nouveau contact</a>
  </div>
  <table class="table table-sm table-striped">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Partie</th>
      </tr>
    </thead>
    <tbody>
      {% for c in contacts %}
      <tr>
        <td><a href="{% url 'crm:contact_detail' c.pk %}">{{ c.first_name }} {{ c.last_name }}</a></td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone }}</td>
        <td>{{ c.party.name }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center text-muted">Aucun contact</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
