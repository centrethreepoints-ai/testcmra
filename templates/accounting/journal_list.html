{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>Journaux</h3>
  <table class="table table-sm table-striped">
    <thead>
      <tr>
        <th>Code</th>
        <th>Nom</th>
      </tr>
    </thead>
    <tbody>
      {% for j in journals %}
      <tr>
        <td>{{ j.code }}</td>
        <td>{{ j.name }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="2" class="text-center text-muted">Aucun journal</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
