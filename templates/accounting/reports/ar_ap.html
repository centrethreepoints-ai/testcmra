{% extends 'base.html' %}
{% load humanize %}
{% block content %}
<div class="container py-4">
  <h3>Clients / Fournisseurs</h3>
  <div class="row g-3">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="text-muted">Encours clients (AR)</div>
              <div class="h4 mb-0">{{ ar_balance|floatformat:2 }} MAD</div>
            </div>
            <i class="bi bi-people h2 text-primary"></i>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="text-muted">Dettes fournisseurs (AP)</div>
              <div class="h4 mb-0">{{ ap_balance|floatformat:2 }} MAD</div>
            </div>
            <i class="bi bi-truck h2 text-danger"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
