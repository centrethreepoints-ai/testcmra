{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>Paramètres de la société</h3>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nom</label>
        <input class="form-control" type="text" name="name" value="{{ company.name }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" value="{{ company.email }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Téléphone</label>
        <input class="form-control" type="text" name="phone" value="{{ company.phone }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Ville</label>
        <input class="form-control" type="text" name="city" value="{{ company.city }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Logo (PNG/JPG)</label>
        <input class="form-control" type="file" name="logo" accept="image/*">
      </div>
      <div class="col-md-6 d-flex align-items-end">
        {% if company.logo %}
          <img src="{{ company.logo.url }}" alt="Logo" class="img-thumbnail" style="max-height:80px;">
        {% else %}
          <span class="text-muted">Aucun logo</span>
        {% endif %}
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
