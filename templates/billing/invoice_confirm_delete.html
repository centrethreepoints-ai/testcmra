{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>Supprimer la facture</h3>
  <p>Confirmez la suppression de "{{ object.number }}".</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Confirmer</button>
    <a href="{% url 'billing:invoice_list' %}" class="btn btn-secondary">Annuler</a>
  </form>
</div>
{% endblock %}
