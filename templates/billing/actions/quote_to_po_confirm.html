{% extends 'base.html' %}
{% block content %}
<div class="container py-4 text-center">
  <h4>Convertir le devis {{ quote.number }} en bon de commande ?</h4>
  <form method="post" class="mt-3">
    {% csrf_token %}
    <button class="btn btn-success" type="submit">Oui, convertir</button>
    <a class="btn btn-secondary" href="{% url 'billing:quote_detail' quote.pk %}">Annuler</a>
  </form>
</div>
{% endblock %}
