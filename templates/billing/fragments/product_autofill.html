<span id="unit-price-{{ index }}" hx-swap-oob="true">
  <input type="number" step="0.01" min="0" name="lines-{{ index }}-unit_price_ht" class="form-control text-end line-unit-price" value="{{ unit_price }}" />
</span>
<span id="description-{{ index }}" hx-swap-oob="true">
  <input type="text" name="lines-{{ index }}-description" class="form-control" value="{{ description }}" />
</span>
