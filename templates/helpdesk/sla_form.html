{% extends 'base.html' %}

{% block title %}Nouveau SLA{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Nouveau SLA</h5>
          <a href="{% url 'helpdesk:sla_list' %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Nom</label>
              <input class="form-control" type="text" name="name" required>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Temps de réponse (heures)</label>
                <input class="form-control" type="number" min="0" name="response_time_hours" value="8">
              </div>
              <div class="col-md-6">
                <label class="form-label">Temps de résolution (heures)</label>
                <input class="form-control" type="number" min="0" name="resolution_time_hours" value="72">
              </div>
            </div>
            <div class="form-check mt-3">
              <input class="form-check-input" type="checkbox" name="active" id="active" checked>
              <label class="form-check-label" for="active">Actif</label>
            </div>
            <div class="mt-4 d-flex justify-content-end gap-2">
              <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Enregistrer</button>
              <a class="btn btn-outline-secondary" href="{% url 'helpdesk:sla_list' %}">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
