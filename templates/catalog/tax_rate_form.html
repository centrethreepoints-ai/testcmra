{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>Taux de TVA</h3>
  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nom</label>
        <input class="form-control" type="text" name="name" value="{{ tax_rate.name }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Taux (%)</label>
        <input class="form-control" type="number" step="0.01" name="rate" value="{{ tax_rate.rate }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Actif</label>
        <select class="form-select" name="is_active">
          <option value="true" {% if tax_rate.is_active %}selected{% endif %}>Oui</option>
          <option value="false" {% if not tax_rate.is_active %}selected{% endif %}>Non</option>
        </select>
      </div>
    </div>
    <div class="row g-3 mt-1">
      <div class="col-md-4">
        <label class="form-label">Code</label>
        <input class="form-control" type="text" name="code" value="{{ tax_rate.code }}">
      </div>
      <div class="col-md-8">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="2">{{ tax_rate.description }}</textarea>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Enregistrer</button>
      <a href="{% url 'catalog:tax_rate_list' %}" class="btn btn-secondary">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
