{% extends 'base.html' %}
{% block title %}Taux de TVA - Catalogue{% endblock %}
{% block content %}
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 mb-0"><i class="bi bi-percent me-2"></i>Taux de TVA</h2>
    <div>
      <a href="{% url 'catalog:tax_rate_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i> Nouveau taux
      </a>
    </div>
  </div>

  <div class="card shadow">
    <div class="card-header py-3">
      <h6 class="m-0 font-weight-bold text-primary">Liste des taux</h6>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Nom</th>
              <th class="text-end" style="width: 160px;">Taux (%)</th>
              <th class="text-center" style="width: 140px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for t in tax_rates %}
            <tr>
              <td>{{ t.name }}</td>
              <td class="text-end">{{ t.rate|floatformat:2 }}</td>
              <td class="text-center">
                <a href="{% url 'catalog:tax_rate_edit' t.id %}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                <a href="{% url 'catalog:tax_rate_delete' t.id %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
              </td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="text-center text-muted py-4">Aucun taux trouvé.</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
