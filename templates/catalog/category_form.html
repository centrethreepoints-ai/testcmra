{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>Catégorie</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Nom</label>
      <input class="form-control" type="text" name="name" value="{{ category.name }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="3">{{ category.description }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Catégorie parente</label>
      <select class="form-select" name="parent">
        <option value="">— Aucune —</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if category.parent and c.id == category.parent.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn btn-primary" type="submit">Enregistrer</button>
    <a href="{% url 'catalog:category_list' %}" class="btn btn-secondary">Annuler</a>
  </form>
</div>
{% endblock %}
