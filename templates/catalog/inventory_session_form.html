{% extends 'base.html' %}
{% block title %}Nouvelle session d'inventaire{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Nouvelle session d'inventaire</h3>
    <a href="{% url 'catalog:inventory_session_list' %}" class="btn btn-outline-secondary btn-sm">Retour</a>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" name="name" placeholder="Inventaire {{ now|date:'Y-m-d' }}">
          </div>
          <div class="col-md-3">
            <label class="form-label">Périmètre</label>
            <select class="form-select" name="scope_type" id="scope_type">
              <option value="all">Tous les produits</option>
              <option value="category">Par catégorie</option>
            </select>
          </div>
          <div class="col-md-3" id="category_field" style="display:none;">
            <label class="form-label">Catégorie</label>
            <select class="form-select" name="category">
              <option value="">—</option>
              {% for c in categories %}
              <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" name="is_blind" id="is_blind">
              <label class="form-check-label" for="is_blind">Comptage à l’aveugle</label>
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" name="freeze_stock" id="freeze_stock">
              <label class="form-check-label" for="freeze_stock">Geler les mouvements</label>
            </div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Tolérance %</label>
            <input type="number" step="0.01" min="0" class="form-control" name="tolerance_percent" placeholder="0">
          </div>
        </div>
        <div class="mt-4 d-flex justify-content-end">
          <button class="btn btn-primary" type="submit">Créer</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function(){
  const scope = document.getElementById('scope_type');
  const cat = document.getElementById('category_field');
  function toggleCat(){ cat.style.display = scope.value === 'category' ? '' : 'none'; }
  scope.addEventListener('change', toggleCat);
  toggleCat();
});
</script>
{% endblock %}
