{% extends 'base.html' %}

{% block title %}Définir le mot de passe{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0"><i class="bi bi-key"></i> Définir le mot de passe</h5>
          <a href="{% url 'users:user_detail' user_obj.pk %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
        </div>
        <div class="card-body">
          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              {{ form.new_password1.label_tag }}
              {{ form.new_password1 }}
            </div>
            <div class="mb-3">
              {{ form.new_password2.label_tag }}
              {{ form.new_password2 }}
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Enregistrer</button>
              <a class="btn btn-outline-secondary" href="{% url 'users:user_detail' user_obj.pk %}">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  
</div>
{% endblock %}
